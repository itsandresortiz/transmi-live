<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TransMi LIVE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Buses de TransMilenio y SITP en Bogotá en tiempo real: dónde están, qué tan puntuales van, próximas llegadas y avisos de servicio.">
<title>TransMi LIVE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://kmefztxxhipjowgcfxds.supabase.co" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="map" role="application" aria-label="Mapa de Bogotá con buses en tiempo real"></div>

<header class="top">
  <div class="brand glass">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21l1.5-4M16 21l-1.5-4"/><circle cx="8" cy="14" r=".7"/><circle cx="16" cy="14" r=".7"/></svg></div>
    <div class="bt"><b>TransMi <i>LIVE</i></b><div class="st" id="status"><span class="dot" id="sdot"></span><span id="stxt">Conectando…</span></div></div>
  </div>
  <div class="tools">
    <button class="fab glass" id="locate" aria-label="Mi ubicación"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5V6M12 18v3.5M2.5 12H6M18 12h3.5"/></svg></button>
    <button class="fab glass" id="openSettings" aria-label="Ajustes del mapa" aria-pressed="false"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<main class="sheet glass" id="sheet" aria-label="Rutas, buses, paradas y avisos">
  <div class="shead" id="shead">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Subir o bajar el panel"><i></i></div>
    <label class="search">
      <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar ruta o destino" aria-label="Buscar">
      <button class="clear" id="clear" type="button" hidden aria-label="Borrar búsqueda"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </label>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="rutas" aria-selected="true">Rutas</button>
      <button class="tab" role="tab" data-tab="buses" aria-selected="false">Buses</button>
      <button class="tab" role="tab" data-tab="paradas" aria-selected="false">Paradas</button>
      <button class="tab" role="tab" data-tab="avisos" aria-selected="false">Avisos<span class="n" id="avisoN" hidden></span></button>
    </div>
  </div>
  <div class="view" id="view" role="tabpanel" aria-live="polite"></div>
</main>

<div class="scrim" id="scrim"></div>
<section class="settings glass" id="settings" role="dialog" aria-modal="true" aria-label="Ajustes del mapa"></section>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="position:fixed;inset:auto 16px 16px;padding:14px;border-radius:14px;background:#fff;color:#111;z-index:99">TransMi LIVE necesita JavaScript para mostrar el mapa.</p></noscript>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="assets/geo.js?v=3"></script>
<script defer src="assets/roads.js?v=3"></script>
<script defer src="assets/streets.js?v=3"></script>
<script defer src="app.js?v=3"></script>
<script defer src="ui.js?v=3"></script>
</body>
</html>
