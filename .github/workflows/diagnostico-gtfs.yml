name: Diagnóstico GTFS (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set -x
          curl -sSL -m 60 -A "Mozilla/5.0 (transmi-live)" -o index.html -w "index %{http_code} %{size_download}\n" https://gtfs.transmilenio.gov.co/ || true
          head -c 1500 index.html || true; echo
          curl -sSIL -m 60 -A "Mozilla/5.0 (transmi-live)" https://gtfs.transmilenio.gov.co/GTFS.zip | grep -i -E "HTTP|last-modified|content-length|etag" || true
          curl -fsSL --retry 3 --max-time 600 -A "Mozilla/5.0 (transmi-live)" -o GTFS.zip https://gtfs.transmilenio.gov.co/GTFS.zip
          unzip -p GTFS.zip feed_info.txt | head -5
          unzip -p GTFS.zip calendar.txt | head -4
          unzip -p GTFS.zip frequencies.txt | head -3
          python3 - <<'PY'
          import zipfile, csv, io
          z = zipfile.ZipFile("GTFS.zip")
          trips = {r["trip_id"] for r in csv.DictReader(io.TextIOWrapper(z.open("trips.txt"), encoding="utf-8-sig"))}
          print("viajes en el GTFS:", len(trips))
          for t in ["TTABA0759.10.11878", "TTABA0652.15.12462", "TTABA0541.1.12971", "CN19A0016.3.12674", "TTABA1331.3.12428"]:
              print(t, "esta" if t in trips else "NO ESTA")
          print("ejemplos de viaje del GTFS:", sorted(trips)[:3], sorted(trips)[-3:])
          PY
