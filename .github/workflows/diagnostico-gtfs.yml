name: Diagnóstico GTFS (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          curl -fsSL --retry 3 --max-time 600 -A "Mozilla/5.0 (transmi-live)" -o GTFS.zip https://gtfs.transmilenio.gov.co/GTFS.zip
          python3 - <<'PY'
          import zipfile, csv, io, collections
          z = zipfile.ZipFile("GTFS.zip")
          def rows(n):
              with z.open(n) as f:
                  yield from csv.DictReader(io.TextIOWrapper(f, encoding="utf-8-sig", newline=""))
          print("archivos:", [i.filename for i in z.infolist()][:20])
          for i in z.infolist():
              if i.filename.endswith("feed_info.txt"): print(z.read(i).decode("utf-8-sig")[:300])
          stops = {r["stop_id"]: r for r in rows("stops.txt")}
          for sid, r in stops.items():
              n = r["stop_name"].lower()
              if "manuela beltr" in n and ("53" in n or "calle" in n): print("PARADA", sid, r["stop_name"], r["stop_lat"], r["stop_lon"])
          target = {"90012"}
          trips = collections.defaultdict(set)
          for r in rows("stop_times.txt"):
              if r["stop_id"] in target: trips[r["stop_id"]].add(r["trip_id"])
          print("viajes que paran en 90012:", {k: len(v) for k, v in trips.items()})
          tr = {r["trip_id"]: r for r in rows("trips.txt")}
          rt = {r["route_id"]: r["route_short_name"] for r in rows("routes.txt")}
          names = sorted({rt.get(tr[t]["route_id"], "?") for t in trips.get("90012", []) if t in tr})
          print("rutas:", names[:60], len(names))
          pats = collections.Counter((tr[t]["route_id"], tr[t].get("direction_id"), tr[t].get("shape_id")) for t in trips.get("90012", []) if t in tr)
          print("patrones (ruta,sentido,trazado):", len(pats), pats.most_common(5))
          # cuántos patrones por ruta/sentido hay en total y cuántos se pierden al quedarse con uno
          allp = collections.defaultdict(set)
          for r in tr.values(): allp[(r["route_id"], r.get("direction_id"))].add(r.get("shape_id"))
          print("ruta-sentido con más de un trazado:", sum(1 for v in allp.values() if len(v) > 1), "de", len(allp))
          PY
