name: Publicar app web
# Publica la app en GitHub Pages cada vez que cambia el código (Settings > Pages > Source = "GitHub Actions").
on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "tools/seo.ts", "package.json", "package-lock.json", "tsconfig*.json", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"        # cada lunes: las páginas de rutas y estaciones se regeneran con el GTFS más reciente
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # páginas estáticas para buscadores (una por ruta y estación). Si falla la descarga del GTFS, la app se publica igual.
      - run: npx tsx tools/seo.ts apps/web/dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
