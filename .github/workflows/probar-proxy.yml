name: Probar intermediario
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Direccion base de la funcion"
        required: true
        default: "https://kmefztxxhipjowgcfxds.supabase.co/functions/v1/tm"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_proxy.py "${{ inputs.base }}"
