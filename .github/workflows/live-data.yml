name: Datos en vivo
on:
  schedule:
    - cron: "*/5 * * * *"   # respaldo: GitHub retrasa o salta estos horarios
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Refrescar cada ~30 s durante ~5 min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/live_loop.sh
      - name: Relanzar para seguir sin pausa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-data.yml --repo "$GITHUB_REPOSITORY" --ref main || true
