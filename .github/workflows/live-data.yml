name: Datos en vivo
on:
  schedule:
    - cron: "*/5 * * * *"   # respaldo: GitHub retrasa o salta estos horarios
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Refrescar cada ~30 s durante ~5 min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/live_loop.sh
      - name: Revisar que el otro proceso de datos siga andando
        # cada proceso se relanza solo al terminar; si un arranque falla, la cadena se rompe y el horario de respaldo de GitHub puede tardar horas.
        # Por eso cada uno revisa al otro y lo vuelve a lanzar si no hay ninguna ejecución en curso ni en espera.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$( (gh run list --repo "$GITHUB_REPOSITORY" --workflow widget-data.yml --status in_progress --json databaseId --jq length; gh run list --repo "$GITHUB_REPOSITORY" --workflow widget-data.yml --status queued --json databaseId --jq length) 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo 1)
          if [ "${N:-1}" = "0" ]; then echo "widget-data.yml estaba detenido: se relanza"; gh workflow run widget-data.yml --repo "$GITHUB_REPOSITORY" --ref main || true; fi
          H=$( (gh run list --repo "$GITHUB_REPOSITORY" --workflow hop-stats.yml --status in_progress --json databaseId --jq length; gh run list --repo "$GITHUB_REPOSITORY" --workflow hop-stats.yml --status queued --json databaseId --jq length) 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo 1)
          if [ "${H:-1}" = "0" ]; then echo "hop-stats.yml estaba detenido: se relanza"; gh workflow run hop-stats.yml --repo "$GITHUB_REPOSITORY" --ref main || true; fi
          # la red del día (GTFS, cierres temporales de vagones) se arma a las 4:30 a. m., pero el horario de GitHub la retrasa hasta 10 h:
          # si pasadas las 4:30 de Bogotá aún no ha corrido hoy, se lanza aquí
          HOY=$(TZ=America/Bogota date +%F); HORA=$(TZ=America/Bogota date +%H%M)
          ULT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gtfs-daily.yml --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          ULTD=$( [ -n "$ULT" ] && TZ=America/Bogota date -d "$ULT" +%F || echo "")
          if [ "$HORA" -ge 0430 ] && [ "$ULTD" != "$HOY" ]; then echo "GTFS diario aún no corre hoy ($ULTD): se lanza"; gh workflow run gtfs-daily.yml --repo "$GITHUB_REPOSITORY" --ref main || true; fi
      - name: Relanzar para seguir sin pausa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-data.yml --repo "$GITHUB_REPOSITORY" --ref main || true
