name: Llegadas para el widget
# Publica en la rama widget-data los próximos buses de cada parada, para que el widget del teléfono se actualice aunque la app esté cerrada.
on:
  schedule:
    - cron: "*/5 * * * *"   # respaldo: GitHub retrasa o salta estos horarios
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: widget-data
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Calcular y publicar cada ~50 s durante ~5 min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx tools/widget-arrivals.ts
      - name: Revisar que el otro proceso de datos siga andando
        # cada proceso se relanza solo al terminar; si un arranque falla, la cadena se rompe y el horario de respaldo de GitHub puede tardar horas.
        # Por eso cada uno revisa al otro y lo vuelve a lanzar si no hay ninguna ejecución en curso ni en espera.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$( (gh run list --repo "$GITHUB_REPOSITORY" --workflow live-data.yml --status in_progress --json databaseId --jq length; gh run list --repo "$GITHUB_REPOSITORY" --workflow live-data.yml --status queued --json databaseId --jq length) 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo 1)
          if [ "${N:-1}" = "0" ]; then echo "live-data.yml estaba detenido: se relanza"; gh workflow run live-data.yml --repo "$GITHUB_REPOSITORY" --ref main || true; fi
      - name: Relanzar para seguir sin pausa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run widget-data.yml --repo "$GITHUB_REPOSITORY" --ref main || true
