name: Árboles y edificios para el mapa 3D
# A mano (y una vez al mes): baja de los datos abiertos del mapa 3D de Bogotá (IDECA) el censo del arbolado urbano (Jardín Botánico) y las
# construcciones de Catastro con sus pisos, más los árboles de OpenStreetMap, y los publica por celdas en las ramas `arboles` y
# `edificios` (ver tools/arboles.ts y tools/edificios.ts). La web y la app los piden solo con la vista 3D encendida y de cerca; sin estas
# ramas siembran árboles en los parques y usan los edificios del mapa base.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 3 * *"        # día 3 de cada mes, 2:41 a. m. de Bogotá
permissions:
  contents: write
concurrency: { group: mapa-3d, cancel-in-progress: false }
jobs:
  arboles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx --yes tsx tools/arboles.ts dist-arboles
        env:
          ARBOLADO_URL: ${{ vars.ARBOLADO_URL }}
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: arboles
        run: bash scripts/publish.sh dist-arboles
  edificios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx --yes tsx tools/edificios.ts dist-edificios
      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: edificios
        run: bash scripts/publish.sh dist-edificios
