name: Medir ritmo del intermediario
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Direccion base de la funcion"
        required: true
        default: "https://kmefztxxhipjowgcfxds.supabase.co/functions/v1/rapid-responder"
      seconds:
        description: "Duracion de la medicion (s)"
        required: true
        default: "240"
jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_cadence.py "${{ inputs.base }}" "${{ inputs.seconds }}"
