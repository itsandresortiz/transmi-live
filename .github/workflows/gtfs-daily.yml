name: GTFS diario
on:
  schedule:
    - cron: "30 9 * * *"   # 04:30 hora de Bogotá
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtfs-daily
  cancel-in-progress: false
jobs:
  gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y reducir GTFS.zip
        run: |
          mkdir out
          curl -fsSL --retry 3 --max-time 600 -A "Mozilla/5.0 (transmi-live)" -o GTFS.zip https://gtfs.transmilenio.gov.co/GTFS.zip
          python3 scripts/slim_gtfs.py GTFS.zip out/gtfs-lite.zip
          python3 scripts/build_schedule.py GTFS.zip out/schedule.json
          gzip -9 -k out/schedule.json && rm out/schedule.json
          ls -lh out
      - name: Publicar en la rama live-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # el bucle de datos en vivo también escribe en live-data: se repite hasta comprobar que los archivos quedaron
          for i in 1 2 3 4 5; do
            bash scripts/publish.sh out
            sleep 45
            git ls-remote --exit-code origin live-data >/dev/null
            tmp="$(mktemp -d)"
            git clone -q --depth 1 --branch live-data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp"
            if [ -f "$tmp/schedule.json.gz" ] && [ -f "$tmp/gtfs-lite.zip" ]; then echo "verificado"; break; fi
            echo "intento $i: faltan archivos, se repite"
          done
