name: GTFS diario
on:
  schedule:
    - cron: "30 9 * * *"   # 04:30 hora de Bogotá
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtfs-daily
  cancel-in-progress: false
jobs:
  gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y reducir GTFS.zip
        run: |
          mkdir out sched
          curl -fsSL --retry 3 --max-time 600 -A "Mozilla/5.0 (transmi-live)" -o GTFS.zip https://gtfs.transmilenio.gov.co/GTFS.zip
          python3 scripts/slim_gtfs.py GTFS.zip out/gtfs-lite.zip
          python3 scripts/build_schedule.py GTFS.zip sched/schedule.json
          gzip -9 sched/schedule.json sched/service-ends.json
          ls -lh out sched
      - name: Publicar el GTFS reducido en la rama live-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh out
      - name: Publicar el perfil de horarios en su propia rama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: schedule-data
        run: bash scripts/publish.sh sched
